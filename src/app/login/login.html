<div class="login-page">
  <div class="login-card">

    <h1>🔐 SecureTask</h1>
    <p class="subtitle">Secure Task Management</p>

   <form (ngSubmit)="login()">

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="admin@securetask.com"
      required
    >
  </div>

  <div class="form-group">
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      required
    >
  </div>

  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>

  <button type="submit">Login</button>

</form>

    <p class="security-text">
      🔒 Protected by SecureTask
    </p>

  </div>
</div>
